<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>💘 Valentine?</title>

<style>
:root{
  --bg1:#120015; --bg2:#2a001f;
  --card:#ffffff10; --card2:#ffffff18;
  --text:#fff; --muted:#ffd6e7;
  --yes:#2ee59d; --yes2:#1ccf8b;
  --no:#ff5b7a; --no2:#ff3d63;
  --shadow: 0 18px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  color:var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  background:
    radial-gradient(1200px 800px at 20% 10%, #5c003f 0%, transparent 55%),
    radial-gradient(1000px 700px at 80% 90%, #3b005c 0%, transparent 55%),
    linear-gradient(135deg, var(--bg1), var(--bg2));
  overflow:hidden;
}

/* floating hearts */
.hearts{
  position:fixed; inset:0; pointer-events:none; overflow:hidden;
  opacity:.95; z-index:0;
}
.heart{
  position:absolute;
  font-size:22px;
  animation: floatUp linear forwards;
}
@keyframes floatUp{
  from{ transform: translateY(20px) scale(.8); opacity:0; }
  10%{opacity:1}
  to{ transform: translateY(-120vh) scale(1.3); opacity:0; }
}

/* card */
.card{
  width:min(780px, 94vw);
  max-height:92vh;
  overflow:auto;
  padding:24px;
  border-radius:24px;
  background: linear-gradient(180deg, var(--card2), var(--card));
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(10px);
  z-index:1;
}

/* centered header */
.top{
  text-align:center;
  margin-bottom:10px;
}
.badge{
  width:44px; height:44px;
  display:grid; place-items:center;
  margin:0 auto 6px auto;
  border-radius:14px;
  background:#ff3d631f;
  border:1px solid rgba(255,255,255,.18);
  font-size:22px;
}
h1{
  margin:0;
  font-size:18px;
  letter-spacing:.6px;
  text-transform:uppercase;
}
#tinyLine{
  margin-top:4px;
  font-size:14px;
  opacity:.9;
}

/* panels */
.stage{ position:relative; min-height:420px; }
.panel{
  position:absolute; inset:0;
  display:grid; place-items:center;
  opacity:0; transform:translateY(10px);
  transition:.4s ease;
  pointer-events:none;
}
.panel.active{
  opacity:1; transform:none;
  pointer-events:auto;
}

.center{
  text-align:center;
  width:100%;
  max-width:720px;
  margin:0 auto;
}

.big{ font-size:30px; margin-bottom:10px; }
.sub{ max-width:60ch; margin:0 auto; color:var(--muted); }

/* 🔥 Bigger fonts ONLY for Intro + Ask */
.scaleIntro .big{ font-size:42px; }
.scaleIntro .sub{ font-size:19px; }

.scaleAsk .big{ font-size:42px; }
.scaleAsk .sub{ font-size:19px; }
.scaleAsk button{ font-size:18px; padding:14px 22px; }

/* buttons */
.btnrow{ margin-top:16px; display:flex; justify-content:center; gap:14px; }
button{
  border:0; cursor:pointer;
  padding:12px 18px;
  border-radius:14px;
  font-weight:700;
  font-size:16px;
}
.yes{
  background: linear-gradient(180deg, var(--yes), var(--yes2));
  color:#072318;
}
.no{
  background: linear-gradient(180deg, var(--no), var(--no2));
  color:#2a000b;
}
.ghost{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
}

/* no arena */
.arena{
  margin:14px auto 0;
  width:100%; max-width:560px;
  height:130px;
  border-radius:18px;
  border:1px dashed rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  position:relative;
}
.noMover{
  position:absolute;
  left:58%; top:54%;
  transform:translate(-50%, -50%);
}

/* YES page note */
.loveNote{
  text-align:left;
  padding:16px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  margin-top:14px;
  max-height:44vh;
  overflow:auto;
}
.loveNote p{ line-height:1.55; font-size:15px; }
.sig{ margin-top:10px; font-weight:700; }
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<main class="card">
<div class="top">
  <div class="badge">💘</div>
  <h1>HAPPY VALENTINES DAY MY POOK</h1>
  <div id="tinyLine">only for Dana 🤫</div>
</div>

<section class="stage">

<!-- Intro -->
<div class="panel active scaleIntro" id="panelIntro">
  <div class="center">
    <h2 class="big">Hi My Love ❤️</h2>
    <p class="sub" id="introText"></p>
    <div class="btnrow">
      <button class="yes" id="btnContinue">Continue ➜</button>
    </div>
  </div>
</div>

<!-- Ask -->
<div class="panel scaleAsk" id="panelAsk">
  <div class="center">
    <h2 class="big">Dana, will you be my Valentine? 💌</h2>
    <p class="sub" id="askSub"></p>
    <div class="btnrow">
      <button class="yes" id="btnYes">YESSSSSS 😘</button>
    </div>
    <div class="arena">
      <button class="no noMover" id="btnNo">No 😔</button>
    </div>
    <div class="sub" id="noHint">You sure? 🥺</div>
  </div>
</div>

<!-- Yes -->
<div class="panel" id="panelYes">
  <div class="center">
    <h2 class="big">YAYYYYYYY!!! 💞💞💞</h2>
    <p class="sub">Okay now you’re officially mine forever 😜</p>
    <div class="loveNote">
      <h3>Hey Dana,</h3>
      <p id="loveBody"></p>
      <div class="sig">— from your ugly bugly, Sehej ♥️</div>
    </div>
  </div>
</div>

</section>
</main>

<script>
const INTRO_LINE = "I have been programming this for a month and I really hope you like this. I know we are long distance but I don't ever wanna let that stop me from showing how obsessed and in love I am with you. I hope it's not too cringe!!!!";
const ASK_SUB = "No pressure… but just don't let this be the new worst day of my life 😭💕";

const YES_BODY = `Dana, I love you so much... (rest of your message stays here)`;

// elements
const panelIntro = document.getElementById("panelIntro");
const panelAsk = document.getElementById("panelAsk");
const panelYes = document.getElementById("panelYes");

document.getElementById("introText").textContent = INTRO_LINE;
document.getElementById("askSub").textContent = ASK_SUB;
document.getElementById("loveBody").innerHTML = YES_BODY.replace(/\n/g,"<br>");

function show(p){
  [panelIntro,panelAsk,panelYes].forEach(x=>x.classList.remove("active"));
  p.classList.add("active");
}

document.getElementById("btnContinue").onclick=()=>show(panelAsk);
document.getElementById("btnYes").onclick=()=>show(panelYes);

// hearts
const heartChars=["💖","💘","💝","💗","💓","💕","❤️"];
function spawnHeart(){
  const el=document.createElement("div");
  el.className="heart";
  el.textContent=heartChars[Math.floor(Math.random()*heartChars.length)];
  el.style.left=Math.random()*100+"vw";
  el.style.bottom="-20vh";
  el.style.fontSize=(18+Math.random()*18)+"px";
  el.style.animationDuration=(3+Math.random()*3)+"s";
  document.getElementById("hearts").appendChild(el);
  setTimeout(()=>el.remove(),6000);
}
setInterval(spawnHeart,180);
</script>

</body>
</html>
