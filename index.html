<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>💘 Valentine?</title>
  <style>
    :root{
      --bg1:#120015; --bg2:#2a001f;
      --card:#ffffff10; --card2:#ffffff18;
      --text:#fff; --muted:#ffd6e7;
      --yes:#2ee59d; --yes2:#1ccf8b;
      --no:#ff5b7a; --no2:#ff3d63;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 800px at 20% 10%, #5c003f 0%, transparent 55%),
                  radial-gradient(1000px 700px at 80% 90%, #3b005c 0%, transparent 55%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    /* floating hearts background */
    .hearts{
      position:fixed; inset:0; pointer-events:none; overflow:hidden;
      opacity:.95;
      z-index:0;
    }
    .heart{
      position:absolute;
      font-size:22px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.35));
      animation: floatUp linear forwards;
      user-select:none;
    }
    @keyframes floatUp{
      from{ transform: translateY(20px) scale(.8) rotate(0deg); opacity:0; }
      10%{opacity:1}
      to{ transform: translateY(-120vh) scale(1.3) rotate(25deg); opacity:0; }
    }

    .card{
      width:min(680px, 92vw);
      padding:28px 26px;
      border-radius:24px;
      background: linear-gradient(180deg, var(--card2), var(--card));
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(10px);
      position:relative;
      z-index:1; /* keep card above hearts */
    }
    .top{
      display:flex; align-items:center; gap:12px;
      margin-bottom:14px;
    }
    .badge{
      width:42px; height:42px; border-radius:14px;
      display:grid; place-items:center;
      background: #ff3d631f;
      border: 1px solid rgba(255,255,255,.18);
      font-size:22px;
    }
    h1{
      margin:0; font-size:22px; letter-spacing:.2px;
    }
    p{
      margin:12px 0 0; line-height:1.45; color:var(--muted);
      font-size:16px;
    }

    .stage{
      margin-top:18px;
      min-height: 220px;
      position:relative;
    }
    .panel{
      position:absolute; inset:0;
      display:grid; place-items:center;
      opacity:0; transform: translateY(10px);
      transition: opacity .5s ease, transform .5s ease;
      pointer-events:none;
    }
    .panel.active{
      opacity:1; transform: translateY(0);
      pointer-events:auto;
    }
    .center{
      text-align:center;
      padding:8px 6px;
      width:100%;
    }
    .big{
      font-size:28px;
      margin:0 0 10px;
    }
    .sub{
      margin:0 auto;
      max-width: 54ch;
      color: var(--muted);
    }

    .btnrow{
      display:flex; justify-content:center; gap:14px;
      margin-top:18px;
      flex-wrap:wrap;
    }
    button{
      border:0; cursor:pointer;
      padding:12px 18px;
      border-radius:14px;
      font-weight:700;
      font-size:16px;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      transition: transform .12s ease, filter .2s ease;
      position:relative;
    }
    button:active{ transform: scale(.98); }
    .yes{
      background: linear-gradient(180deg, var(--yes), var(--yes2));
      color:#072318;
    }
    .no{
      background: linear-gradient(180deg, var(--no), var(--no2));
      color:#2a000b;
    }
    .ghost{
      background: transparent;
      border: 1px solid rgba(255,255,255,.28);
      color: #fff;
      box-shadow:none;
    }
    .hint{
      font-size:13px; opacity:.9; margin-top:10px;
      color: rgba(255,255,255,.8);
    }

    /* No button “run away” area */
    .arena{
      position:relative;
      width:100%;
      height:130px;
      margin-top:16px;
      border-radius:18px;
      border: 1px dashed rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      overflow:hidden;
    }
    .noMover{
      position:absolute;
      left: 58%;
      top: 54%;
      transform: translate(-50%, -50%);
    }

    /* yes screen */
    .loveNote{
      text-align:left;
      padding:18px 18px;
      border-radius:18px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      margin-top:14px;
    }
    .loveNote h2{
      margin:0 0 8px; font-size:20px;
    }
    .loveNote p{
      margin:0;
      color:#ffe6f0;
      line-height:1.55;
    }
    .sig{
      margin-top:10px;
      opacity:.9;
      font-weight:700;
    }

    .fadeIn{
      animation: pop .55s ease both;
    }
    @keyframes pop{
      from{ transform: translateY(8px) scale(.98); opacity:0; }
      to{ transform: translateY(0) scale(1); opacity:1; }
    }

    .footer{
      margin-top:14px;
      display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;
      font-size:12px; opacity:.75;
    }
    a{ color:#fff; }
  </style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="top">
      <div class="badge">💘</div>
      <div>
        <h1>Valentine’s Day</h1>
        <p id="tinyLine">Open me with love.</p>
      </div>
    </div>

    <section class="stage">
      <!-- Intro panel -->
      <div class="panel active" id="panelIntro">
        <div class="center">
          <h2 class="big">Hey my love ❤️</h2>
          <p class="sub" id="introText"></p>

          <div class="btnrow">
            <button class="yes" id="btnContinue">Continue ➜</button>
          </div>
        </div>
      </div>

      <!-- Question panel -->
      <div class="panel" id="panelAsk">
        <div class="center">
          <h2 class="big">Wanna be my Valentine? 💌</h2>
          <p class="sub" id="askSub"></p>

          <div class="btnrow">
            <button class="yes" id="btnYes">YES 😳💖</button>
          </div>

          <div class="arena" id="arena">
            <button class="no noMover" id="btnNo">No 🙃</button>
          </div>

          <div class="hint" id="noHint">Try clicking “No” if you dare.</div>
        </div>
      </div>

      <!-- Yes panel -->
      <div class="panel" id="panelYes">
        <div class="center fadeIn">
          <h2 class="big">YAYYYYYYY!!! 💞💞💞</h2>
          <p class="sub">Okay now you’re officially stuck with me 😌</p>

          <div class="loveNote">
            <h2 id="loveTitle">My message for you ❤️</h2>
            <p id="loveBody"></p>
            <div class="sig" id="sigLine">— from your bf ❤️</div>
          </div>

          <div class="btnrow">
            <button class="ghost" id="btnReplay">Replay</button>
          </div>
        </div>
      </div>
    </section>

    <div class="footer">
      <span>Press <b>R</b> to replay.</span>
    </div>
  </main>

  <script>
    // ====== EASY CUSTOMIZE (edit these) ======
    const GF_NAME = ""; // optional
    const INTRO_LINE = "I have lwky been programming this for a month and I hope you like this. I know we are long distance but I don't wanna let that stop us from putting effort into each other. I hope you enjoy!";
    const ASK_SUB = "No pressure… but also yes pressure 😭💕";
    const YES_TITLE = "My message for you ❤️";
    const YES_BODY = `
You make my days better in ways you don’t even realize. I love the way you exist,
the way you care, and the way you make everything feel lighter.
I’m proud of you, I’m grateful for you, and I choose you—today and always.

Happy Valentine’s Day, my love. 🥺💘
    `.trim();
    const SIGNATURE = "— from your bf ❤️";

    // ====== elements ======
    const panelIntro = document.getElementById("panelIntro");
    const panelAsk = document.getElementById("panelAsk");
    const panelYes = document.getElementById("panelYes");

    const introText = document.getElementById("introText");
    const askSub = document.getElementById("askSub");
    const loveTitle = document.getElementById("loveTitle");
    const loveBody = document.getElementById("loveBody");
    const sigLine = document.getElementById("sigLine");
    const tinyLine = document.getElementById("tinyLine");

    const btnContinue = document.getElementById("btnContinue");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");
    const btnReplay = document.getElementById("btnReplay");

    const arena = document.getElementById("arena");
    const noHint = document.getElementById("noHint");
    const hearts = document.getElementById("hearts");

    // ====== init copy ======
    if (GF_NAME && GF_NAME.trim().length){
      document.querySelector("#panelIntro .big").textContent = `Hey ${GF_NAME} ❤️`;
      tinyLine.textContent = `For ${GF_NAME}.`;
    }
    introText.textContent = INTRO_LINE;
    askSub.textContent = ASK_SUB;
    loveTitle.textContent = YES_TITLE;
    loveBody.innerHTML = YES_BODY.replace(/\n/g, "<br>");
    sigLine.textContent = SIGNATURE;

    // ====== panel helper ======
    function show(panel){
      [panelIntro, panelAsk, panelYes].forEach(p => p.classList.remove("active"));
      panel.classList.add("active");
    }

    // ====== intro -> ask ======
    btnContinue.addEventListener("click", () => show(panelAsk));

    // ====== hearts generator (runs in background all the time) ======
    const heartChars = ["💖","💘","💝","💗","💓","💕","❤️","🫶"];
    let heartTimer = null;

    function spawnHeart(){
      const el = document.createElement("div");
      el.className = "heart";
      el.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
      const left = Math.random()*100;
      const size = 18 + Math.random()*18;
      const dur = 3.2 + Math.random()*2.8;
      el.style.left = left + "vw";
      el.style.bottom = (-10 - Math.random()*20) + "vh";
      el.style.fontSize = size + "px";
      el.style.animationDuration = dur + "s";
      hearts.appendChild(el);
      setTimeout(() => el.remove(), dur*1000 + 200);
    }

    function startHearts(){
      if (heartTimer) return; // already running
      for(let i=0;i<12;i++) setTimeout(spawnHeart, i*80);
      heartTimer = setInterval(spawnHeart, 180);
    }

    startHearts();

    // ====== Yes -> show big message ======
    btnYes.addEventListener("click", () => {
      show(panelYes);
    });

    // ====== No button run away + "you sure?" cycling ======
    const noPhrases = [
      "You sure? 🥺",
      "Like… REALLY sure? 😭",
      "Come onnn 😔",
      "I’ll be sad fr 💔",
      "Last chance 😳",
      "Okay but… YES?? 💖"
    ];
    let noCount = 0;

    function moveNoButton(){
      const rect = arena.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();

      const padding = 10;
      const maxX = rect.width - btnRect.width - padding;
      const maxY = rect.height - btnRect.height - padding;

      const x = padding + Math.random()*Math.max(0, maxX);
      const y = padding + Math.random()*Math.max(0, maxY);

      btnNo.style.left = x + "px";
      btnNo.style.top  = y + "px";
      btnNo.style.transform = "translate(0,0)";
    }

    function updateNoHint(){
      const phrase = noPhrases[noCount % noPhrases.length];
      noHint.textContent = phrase;
      noCount++;
    }

    btnNo.addEventListener("mouseenter", () => {
      moveNoButton();
      updateNoHint();
    });
    btnNo.addEventListener("click", (e) => {
      e.preventDefault();
      moveNoButton();
      updateNoHint();
    });

    // ====== replay ======
    function replay(){
      noCount = 0;
      noHint.textContent = "Try clicking “No” if you dare.";
      btnNo.style.left = "58%";
      btnNo.style.top = "54%";
      btnNo.style.transform = "translate(-50%, -50%)";
      show(panelIntro);
    }
    btnReplay.addEventListener("click", replay);

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "r") replay();
    });
  </script>
</body>
</html>
