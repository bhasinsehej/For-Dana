<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>💘 Valentine?</title>

<style>
:root{
  --bg1:#120015; --bg2:#2a001f;
  --card:#ffffff10; --card2:#ffffff18;
  --text:#fff; --muted:#ffd6e7;
  --yes:#2ee59d; --yes2:#1ccf8b;
  --no:#ff5b7a; --no2:#ff3d63;
}
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family: ui-sans-serif, system-ui;
  color:white;
  background:
    radial-gradient(1200px 800px at 20% 10%, #5c003f 0%, transparent 55%),
    radial-gradient(1000px 700px at 80% 90%, #3b005c 0%, transparent 55%),
    linear-gradient(135deg, var(--bg1), var(--bg2));
  overflow:hidden;
}

/* hearts */
.hearts{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}
.heart{
  position:absolute;
  font-size:22px;
  animation: floatUp linear forwards;
}
@keyframes floatUp{
  from{ transform: translateY(20px) scale(.8); opacity:0; }
  10%{opacity:1}
  to{ transform: translateY(-120vh) scale(1.3); opacity:0; }
}

/* card */
.card{
  width:min(820px, 94vw);
  max-height:92vh;
  overflow:auto;
  padding:40px 32px;
  border-radius:28px;
  background: linear-gradient(180deg, var(--card2), var(--card));
  border: 1px solid rgba(255,255,255,.18);
  backdrop-filter: blur(12px);
  z-index:1;
}

/* header */
.top{
  text-align:center;
  margin-bottom:40px;
}
.badge{
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  margin:0 auto 10px auto;
  border-radius:16px;
  background:#ff3d631f;
  border:1px solid rgba(255,255,255,.18);
  font-size:24px;
}
h1{
  margin:0;
  font-size:22px;
  text-transform:uppercase;
  letter-spacing:1px;
}
#tinyLine{
  margin-top:6px;
  font-size:16px;
  opacity:.9;
}

/* panels */
.stage{
  position:relative;
  min-height:420px;
}
.panel{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  opacity:0;
  transition:.4s ease;
  pointer-events:none;
}
.panel.active{
  opacity:1;
  pointer-events:auto;
}

.center{
  text-align:center;
  width:100%;
  max-width:760px;
  margin:0 auto;
}

/* 🔥 BIGGER FONTS FOR INTRO + ASK */
#panelIntro .big{
  font-size:52px;
  margin-bottom:20px;
}
#panelIntro .sub{
  font-size:22px;
  line-height:1.6;
  max-width:700px;
  margin:0 auto;
}

#panelAsk .big{
  font-size:50px;
  margin-bottom:20px;
}
#panelAsk .sub{
  font-size:21px;
  line-height:1.6;
  max-width:680px;
  margin:0 auto;
}

#panelAsk button{
  font-size:20px;
  padding:16px 28px;
}

/* normal size for YES screen */
.big{
  font-size:32px;
}
.sub{
  color:var(--muted);
}

/* buttons */
.btnrow{
  margin-top:28px;
  display:flex;
  justify-content:center;
  gap:18px;
}
button{
  border:0;
  cursor:pointer;
  padding:14px 24px;
  border-radius:16px;
  font-weight:700;
}
.yes{
  background: linear-gradient(180deg, var(--yes), var(--yes2));
  color:#072318;
}
.no{
  background: linear-gradient(180deg, var(--no), var(--no2));
  color:#2a000b;
}
.ghost{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:white;
}

/* no arena */
.arena{
  margin:22px auto 0;
  width:100%;
  max-width:600px;
  height:150px;
  border-radius:22px;
  border:1px dashed rgba(255,255,255,.25);
  background:rgba(255,255,255,.05);
  position:relative;
}
.noMover{
  position:absolute;
  left:58%;
  top:54%;
  transform:translate(-50%, -50%);
}

/* YES note */
.loveNote{
  text-align:left;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  margin-top:18px;
  max-height:44vh;
  overflow:auto;
}
.loveNote p{
  line-height:1.55;
}
.sig{
  margin-top:12px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<main class="card">
<div class="top">
  <div class="badge">💘</div>
  <h1>HAPPY VALENTINES DAY MY POOK</h1>
  <div id="tinyLine">only for Dana 🤫</div>
</div>

<section class="stage">

<!-- INTRO -->
<div class="panel active" id="panelIntro">
  <div class="center">
    <h2 class="big">Hi My Love ❤️</h2>
    <p class="sub" id="introText"></p>
    <div class="btnrow">
      <button class="yes" id="btnContinue">Continue ➜</button>
    </div>
  </div>
</div>

<!-- ASK -->
<div class="panel" id="panelAsk">
  <div class="center">
    <h2 class="big">Dana, will you be my Valentine? 💌</h2>
    <p class="sub" id="askSub"></p>
    <div class="btnrow">
      <button class="yes" id="btnYes">YESSSSSS 😘</button>
    </div>
    <div class="arena">
      <button class="no noMover" id="btnNo">No 😔</button>
    </div>
    <div class="sub" id="noHint">You sure? 🥺</div>
  </div>
</div>

<!-- YES -->
<div class="panel" id="panelYes">
  <div class="center">
    <h2 class="big">YAYYYYYYY!!! 💞💞💞</h2>
    <p class="sub">Okay now you’re officially mine forever 😜</p>
    <div class="loveNote">
      <h3>Hey Dana,</h3>
      <p id="loveBody"></p>
      <div class="sig">— from your ugly bugly, Sehej ♥️</div>
    </div>
  </div>
</div>

</section>
</main>

<script>
const INTRO_LINE = "I have been programming this for a month and I really hope you like this. I know we are long distance but I don't ever wanna let that stop me from showing how obsessed and in love I am with you. I hope it's not too cringe!!!!";
const ASK_SUB = "No pressure… but just don't let this be the new worst day of my life 😭💕";
const YES_BODY = "Your full long message stays here.";

// init
introText.textContent = INTRO_LINE;
askSub.textContent = ASK_SUB;
loveBody.innerHTML = YES_BODY;

// panel switching
function show(p){
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  p.classList.add("active");
}
btnContinue.onclick=()=>show(panelAsk);
btnYes.onclick=()=>show(panelYes);

// hearts
const heartChars=["💖","💘","💝","💗","💓","💕","❤️"];
function spawnHeart(){
  const el=document.createElement("div");
  el.className="heart";
  el.textContent=heartChars[Math.floor(Math.random()*heartChars.length)];
  el.style.left=Math.random()*100+"vw";
  el.style.bottom="-20vh";
  el.style.fontSize=(18+Math.random()*18)+"px";
  el.style.animationDuration=(3+Math.random()*3)+"s";
  hearts.appendChild(el);
  setTimeout(()=>el.remove(),6000);
}
setInterval(spawnHeart,180);
</script>

</body>
</html>
